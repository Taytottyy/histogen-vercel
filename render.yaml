# Free-tier web service — no Vercel credits required.
# Dashboard: https://dashboard.render.com → New → Blueprint → connect Taytottyy/histogen-vercel
services:
  - type: web
    name: histogen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --app-dir api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SERVE_STATIC
        value: "1"
      - key: USE_PROTEIN_CACHE
        value: "1"
